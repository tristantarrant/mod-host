# JACK daemon configuration for mod-host
# Edit this file to change JACK audio parameters.
# After editing, restart the jackd-modhost service:
#   sudo systemctl restart jackd-modhost.service

# ALSA device name (as shown by 'aplay -l' or 'cat /proc/asound/cards')
ALSA_DEVICE="U192k"

# Sample rate in Hz
SAMPLE_RATE=48000

# Period size (frames per period, lower = less latency but more CPU)
PERIOD_SIZE=128

# Number of periods per buffer
NPERIODS=3

# Input latency compensation (frames)
INPUT_LATENCY=280

# Output latency compensation (frames)
OUTPUT_LATENCY=280

# Realtime priority (1-95)
PRIORITY=80

# Client timeout in milliseconds
TIMEOUT=200
